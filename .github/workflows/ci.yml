name: Contribution checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keeps build artifacts small on the CI runners.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  engine:
    name: Rust engine and the TypeScript SDK against it
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the engine and the server
        run: cargo test --workspace --locked
      - name: Build the server for the SDK's tests
        run: cargo build --locked -p grafeno-server
      # The SDKs live in grafenodb/grafeno-sdk: a change to the HTTP API
      # must keep them working before it lands here.
      - name: Check out the SDKs
        uses: actions/checkout@v4
        with:
          repository: grafenodb/grafeno-sdk
          path: sdk
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install and build the TypeScript SDK
        run: |
          npm ci --prefix sdk/typescript --no-audit --no-fund
          npm run build --prefix sdk/typescript
      - name: Test the TypeScript SDK against this engine
        run: GRAFENO_BIN="$PWD/target/debug/grafeno" npm test --prefix sdk/typescript
      - name: The SDK's contract with this engine and the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bins="$PWD/target/debug/grafeno"
          # The latest published release, if there is one, as the previous engine.
          if tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null)"; then
            mkdir -p "$RUNNER_TEMP/previous"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'grafeno-x86_64-unknown-linux-musl.tar.gz' --dir "$RUNNER_TEMP/previous"
            tar -xzf "$RUNNER_TEMP/previous/grafeno-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/previous"
            bins="$bins:$RUNNER_TEMP/previous/grafeno"
            echo "Previous engine: $tag"
          else
            echo "::notice::No release published yet: the contract runs against this engine only."
          fi
          GRAFENO_CONTRACT_BINS="$bins" node --test sdk/typescript/test/contract.test.ts
      - name: Run the benchmark script once, without performance thresholds
        run: GRAFENO_BIN="$PWD/target/debug/grafeno" GRAFENO_BENCH_ROUNDS=1 node sdk/typescript/bench/read-many.mjs
