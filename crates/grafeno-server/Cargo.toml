[package]
name = "grafeno-server"
description = "HTTP and MCP server for Grafeno"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "grafeno"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
grafeno.workspace = true
grafeno-cluster.workspace = true
grafeno-raft.workspace = true
grafeno-memory = { path = "../grafeno-memory" }
grafeno-query.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
uuid.workspace = true
rustyline = "15"
ureq = { version = "3", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "catch-panic"] }
toml = "0.9"
getrandom = "0.3"
sha2 = "0.10"
argon2 = "0.5"
rpassword = "7"
futures-util = { version = "0.3", default-features = false }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_EventLog"] }

[dev-dependencies]
http-body-util = "0.1"

# `cargo deb` (packaging/linux/Dockerfile builds it). The scripts create the
# grafeno user, /etc/grafeno/grafeno.toml with a token, and start the service.
[package.metadata.deb]
name = "grafeno"
maintainer = "Seerendo <idarkmer@gmail.com>"
copyright = "2026, Seerendo"
extended-description = """\
Grafeno is a graph engine for agent memory and knowledge: a property graph \
with namespaces, facts with valid and record time, full-text and vector \
search, hybrid recall, the GQ query language and an MCP server. It has no \
interface of its own (Grafeno Studio is installed apart). The package runs it \
as the systemd service `grafeno`."""
section = "database"
priority = "optional"
depends = "passwd"
maintainer-scripts = "../../packaging/linux/debian/"
assets = [
    ["target/release/grafeno", "usr/bin/", "755"],
    ["../../packaging/linux/grafeno.service", "lib/systemd/system/grafeno.service", "644"],
    ["../../packaging/linux/grafeno@.service", "lib/systemd/system/grafeno@.service", "644"],
    ["../../packaging/linux/setup.sh", "usr/share/grafeno/setup.sh", "755"],
    ["../../packaging/linux/stop-all.sh", "usr/share/grafeno/stop-all.sh", "755"],
    ["../../packaging/linux/apparmor/grafeno", "etc/apparmor.d/grafeno", "644"],
    ["../../README.md", "usr/share/doc/grafeno/README.md", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/grafeno/LICENSE-MIT", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/grafeno/LICENSE-APACHE", "644"],
]

# `cargo generate-rpm`.
[package.metadata.generate-rpm]
name = "grafeno"
summary = "Graph engine for agent memory and knowledge"
license = "MIT OR Apache-2.0"
post_install_script = "../../packaging/linux/rpm/post.sh"
pre_uninstall_script = "../../packaging/linux/rpm/preun.sh"
post_uninstall_script = "../../packaging/linux/rpm/postun.sh"
assets = [
    { source = "target/release/grafeno", dest = "/usr/bin/grafeno", mode = "755" },
    { source = "../../packaging/linux/grafeno.service", dest = "/usr/lib/systemd/system/grafeno.service", mode = "644" },
    { source = "../../packaging/linux/grafeno@.service", dest = "/usr/lib/systemd/system/grafeno@.service", mode = "644" },
    { source = "../../packaging/linux/setup.sh", dest = "/usr/share/grafeno/setup.sh", mode = "755" },
    { source = "../../packaging/linux/stop-all.sh", dest = "/usr/share/grafeno/stop-all.sh", mode = "755" },
    { source = "../../target/selinux/grafeno.pp", dest = "/usr/share/selinux/packages/grafeno.pp", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/grafeno/README.md", mode = "644", doc = true },
    { source = "../../LICENSE-MIT", dest = "/usr/share/licenses/grafeno/LICENSE-MIT", mode = "644", doc = true },
    { source = "../../LICENSE-APACHE", dest = "/usr/share/licenses/grafeno/LICENSE-APACHE", mode = "644", doc = true },
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# What the package's scripts need (useradd, getent).
[package.metadata.generate-rpm.requires]
shadow-utils = "*"
