[workspace]
resolver = "2"
members = [
    "crates/grafeno-core",
    "crates/grafeno",
    "crates/grafeno-memory",
    "crates/grafeno-query",
    "crates/grafeno-server",
    "crates/grafeno-raft",
    "crates/grafeno-cluster",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/grafenodb/grafeno"

[workspace.dependencies]
grafeno = { path = "crates/grafeno" }
grafeno-core = { path = "crates/grafeno-core" }
grafeno-memory = { path = "crates/grafeno-memory" }
grafeno-query = { path = "crates/grafeno-query" }
grafeno-raft = { path = "crates/grafeno-raft" }
grafeno-cluster = { path = "crates/grafeno-cluster" }
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", default-features = false, features = ["serde"] }

# Debug builds are lightly optimized, and dependencies (redb above all) fully:
# index tests insert thousands of vectors.
[profile.dev]
opt-level = 1
# Line numbers only: full debug info made target/debug grow by tens of GB.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
